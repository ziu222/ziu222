<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 26" width="840" height="26" role="presentation" aria-hidden="true">
  <style>
    .btn { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.82; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .btn { animation: none; } }
  </style>
  <defs>
    <linearGradient id="lineLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC600" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#0088FF" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#7FC4FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFC600" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="lineRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC600" stop-opacity="1"/>
      <stop offset="15%" stop-color="#7FC4FF" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#0088FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#193549" stop-opacity="0.65"/>
    </linearGradient>
    <clipPath id="ballClip">
      <circle cx="420" cy="13" r="10"/>
    </clipPath>
  </defs>

  <!-- Left & right divider bars -->
  <rect x="0" y="11.75" width="398" height="2.5" rx="1.25" fill="url(#lineLeft)"/>
  <rect x="442" y="11.75" width="398" height="2.5" rx="1.25" fill="url(#lineRight)"/>

  <!-- Flanking gold diamonds -->
  <polygon points="403,10 406,13 403,16 400,13" fill="#FFC600"/>
  <polygon points="437,10 440,13 437,16 434,13" fill="#FFC600"/>

  <!-- Classic Pokeball: Red top facing UP, White bottom facing DOWN -->
  <circle cx="420" cy="13" r="11.2" fill="none" stroke="#FFC600" stroke-width="1" stroke-opacity="0.8"/>
  <g clip-path="url(#ballClip)">
    <rect x="409" y="2" width="22" height="11" fill="#EE1515"/>
    <ellipse cx="416.5" cy="6.8" rx="4.2" ry="2" transform="rotate(-22 416.5 6.8)" fill="#FF6B6B" opacity="0.65"/>
    <rect x="409" y="13" width="22" height="11" fill="#F8FAFC"/>
    <path d="M410 19.5 Q420 23.5 430 19.5 L430 24 L410 24 Z" fill="#CBD5E1"/>
    <rect x="409" y="11.7" width="22" height="2.6" fill="#0F2233"/>
  </g>
  <circle cx="420" cy="13" r="10" fill="none" stroke="#0F2233" stroke-width="1.8"/>
  <circle cx="420" cy="13" r="3.8" fill="#0F2233"/>
  <circle class="btn" cx="420" cy="13" r="2.1" fill="#FFFFFF"/>
</svg>
